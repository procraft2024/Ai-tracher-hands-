<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AxTarget Camera Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body, html { margin: 0; background: #000; overflow: hidden; height: 100%; font-family: sans-serif; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        .mirror { transform: scaleX(-1); -webkit-transform: scaleX(-1); }
        #ui-layer { z-index: 10; pointer-events: none; }
        #draw-layer { z-index: 5; pointer-events: none; }
        
        #btn-start {
            position: fixed; inset: 0; z-index: 100; background: #000;
            color: #00ffcc; border: 4px solid #00ffcc; font-size: 24px;
            font-weight: bold; cursor: pointer; display: flex;
            align-items: center; justify-content: center; text-align: center;
        }

        #cube {
            position: absolute; width: 60px; height: 60px;
            border: 2px solid #00ffcc; background: rgba(0,255,204,0.2);
            z-index: 20; border-radius: 10px; display: none;
        }
    </style>
</head>
<body>

<div id="btn-start" onclick="initCamera()">
    CLICCA QUI <br> PER ATTIVARE LA FOTOCAMERA
</div>

<video id="v" style="display:none" playsinline></video>
<canvas id="draw-layer" class="mirror"></canvas>
<canvas id="ui-layer" class="mirror"></canvas>
<div id="cube"></div>

<script>
    const v = document.getElementById('v');
    const dC = document.getElementById('draw-layer');
    const uC = document.getElementById('ui-layer');
    const dX = dC.getContext('2d');
    const uX = uC.getContext('2d');
    const cube = document.getElementById('cube');
    const btn = document.getElementById('btn-start');

    let drawing = false, lastX, lastY;

    function resize() {
        dC.width = uC.width = window.innerWidth;
        dC.height = uC.height = window.innerHeight;
        dX.strokeStyle = '#00ffcc'; dX.lineWidth = 5; dX.lineCap = 'round';
    }
    window.onresize = resize;
    resize();

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    hands.onResults((res) => {
        uX.clearRect(0, 0, uC.width, uC.height);
        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
            const h = res.multiHandLandmarks[0];
            const tip = h[8], mid = h[12], wrs = h[0];
            
            const x = tip.x * dC.width;
            const y = tip.y * dC.height;
            const rx = (1 - tip.x) * window.innerWidth;

            const dTips = Math.hypot(tip.x - mid.x, tip.y - mid.y);
            const isFist = Math.hypot(tip.x - wrs.x, tip.y - wrs.y) < 0.25;

            if (isFist) {
                // Spostamento Piano
                dC.style.transform = `scaleX(-1) translate(${(tip.x-0.5)*200}px, ${(tip.y-0.5)*200}px)`;
                drawing = false;
                cube.style.display = "none";
            } else if (dTips < 0.05) {
                // Cubo
                cube.style.display = "block";
                cube.style.left = (rx - 30) + "px";
                cube.style.top = (y - 30) + "px";
                drawing = false;
            } else if (tip.y < h[6].y) {
                // Disegno
                cube.style.display = "none";
                if (!drawing) { drawing = true; lastX = x; lastY = y; }
                dX.beginPath(); dX.moveTo(lastX, lastY); dX.lineTo(x, y); dX.stroke();
                lastX = x; lastY = y;
            } else {
                drawing = false;
            }

            // Feedback mano
            uX.fillStyle = "#00ffcc";
            [0, 8, 12].forEach(i => {
                uX.beginPath(); uX.arc(h[i].x * uC.width, h[i].y * uC.height, 4, 0, 7); uX.fill();
            });
        }
    });

    async function initCamera() {
        btn.innerText = "ACCESSO IN CORSO...";
        
        try {
            const camera = new Camera(v, {
                onFrame: async () => { await hands.send({image: v}); },
                width: 640, height: 480
            });
            
            await camera.start();
            btn.style.display = 'none'; // Nasconde il tasto solo se la camera parte
        } catch (err) {
            btn.innerText = "ERRORE: CONTROLLA I PERMESSI O USA HTTPS";
            console.error(err);
        }
    }
</script>
</body>
</html>
